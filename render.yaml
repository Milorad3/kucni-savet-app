# Render Blueprint - deploy komandom: povezati GitHub repo na Render,
# Render ce automatski procitati ovaj fajl i kreirati sve servise odjednom.
databases:
  - name: kucni-savet-db
    databaseName: kucnisavet
    plan: free  # promeni u "starter" za produkciju (ima bekape)
    region: frankfurt

services:
  - type: web
    name: kucni-savet-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free  # promeni u "starter" da izbegnes "spavanje" servisa
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kucni-savet-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true  # Render sam generise sigurnu tajnu vrednost

  - type: web
    name: kucni-savet-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: frankfurt
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          name: kucni-savet-backend
          type: web
          property: hostport
