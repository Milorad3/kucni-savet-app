# Render Blueprint - deploy komandom: povezati GitHub repo na Render,
# Render ce automatski procitati ovaj fajl i kreirati sve servise odjednom.
databases:
  - name: kucni-savet-db
    databaseName: kucnisavet
    plan: free  # promeni u "starter" za produkciju (ima bekape)
    region: frankfurt

services:
  - type: web
    name: kucni-savet-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: frankfurt
    plan: free  # promeni u "starter" da izbegnes "spavanje" servisa
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kucni-savet-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true  # Render sam generise sigurnu tajnu vrednost
      # Sledece OPCIONO - aplikacija radi i bez njih, samo bez email/dokument funkcija:
      - key: FRONTEND_URL
        sync: false  # npr. https://kucni-savet-frontend.onrender.com (za linkove u email-ovima)
      - key: SMTP_HOST
        sync: false  # npr. smtp.gmail.com (za slanje poziva na glasanje)
      - key: SMTP_PORT
        sync: false  # npr. 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: S3_BUCKET_NAME
        sync: false  # za upload dokumenata (fakture, ugovori)
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_ENDPOINT_URL
        sync: false  # ostavi prazno za AWS S3, popuni samo za Cloudflare R2/Backblaze B2

  - type: web
    name: kucni-savet-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    region: frankfurt
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false  # RUCNO unosis javni URL backend servisa nakon njegovog deploy-a
        # (fromService/hostport daje INTERNU adresu koja ne radi iz browsera - zato rucno)
